<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Mode</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
    </style>
</head>
<body id="viewer-app">

    <div class="viewer-container" id="viewer-container">
        <!-- Viewport body holding the target website and visuals -->
        <div class="viewer-body" id="viewer-viewport-container" style="width: 100%; height: 100%; position: relative;">
            <!-- Iframe and protection overlays will be injected here by app.js -->
        </div>
    </div>

    <!-- Toast message notification -->
    <div class="toast" id="toast">
        <span class="toast-icon"><i class="fa-solid fa-circle-check"></i></span>
        <span class="toast-text">Toast Alert!</span>
    </div>

    <!-- Main Logic Script -->
    <script src="app.js"></script>
</body>
</html>
